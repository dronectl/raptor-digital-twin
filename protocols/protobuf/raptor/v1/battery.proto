syntax = "proto3";

package raptor.v1;

// battery power states
enum BatteryState {
  // reserved
  BATTERY_STATE_UNSPECIFIED = 0;

  BATTERY_STATE_IDLE = 1;
  BATTERY_STATE_CHARGING = 2;
  BATTERY_STATE_DISCHARGING = 3;
}

message BatteryTelemetry {
  // battery precense flag
  bool precense = 1;
  // battery state
  BatteryState state = 2;
  // battery state of charge (%)
  float soc = 3;
  // battery voltage (V)
  float voltage = 4;
  // battery current (A)
  float current = 5;
}
