syntax = "proto3";

package raptor.v1;

message EnvironmentTelemetry {
  // Relative humidity in (%)
  float humidity = 1;
  // ambient pressure (HPa)
  float pressure = 2;
  // ambient temperature (˚C)
  float temperature = 3;
  // bldc temperature (˚C)
  float bldc_temperature = 4;
  // battery temperature (˚C)
  float battery_temperature = 5;
  // esc temperature (˚C)
  float esc_temperature = 6;
  // aux temperature (˚C)
  repeated float aux_temperatures = 7;
}
